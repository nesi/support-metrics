<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Support Metrics - $month_label</title>
<script src="https://cdn.plot.ly/plotly-3.7.0.min.js"></script>
<style>
body { font-family: -apple-system, Segoe UI, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #1E2422; background: #F5F6F4; }
h1 { font-size: 1.6rem; margin-bottom: 0.2rem; }
.subtitle { color: #5B6560; margin-bottom: 2rem; }
h2 { font-size: 1.15rem; border-left: 4px solid; padding-left: 0.6rem; margin: 0 0 1rem; }
.report-section { margin-bottom: 2.8rem; }
.headline-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 1.2rem; }
.headline-card { background: white; border: 1px solid #DBE1DC; border-radius: 8px; padding: 1rem 1.2rem; }
.headline-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.headline-figure { font-size: 1.3rem; font-weight: 700; margin: 0.3rem 0; }
.headline-sub { font-size: 0.85rem; color: #5B6560; }
.chart-section { background: white; border: 1px solid #DBE1DC; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; overflow-x: auto; }
.chart-section > .headline-label { display: block; margin-bottom: 0.6rem; }
.chart-section img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
.chart-row { display: flex; gap: 1rem; margin-bottom: 1rem; }
.chart-row .chart-section { flex: 1; min-width: 0; margin-bottom: 0; }
.chart-hidden { display: none; }
.page-list { margin: 0.6rem 0 0; padding-left: 1.2rem; }
.page-list li { margin-bottom: 0.3rem; }
.show-more summary { cursor: pointer; color: #5B6560; font-size: 0.85rem; margin-top: 0.4rem; }
.show-more summary:hover { color: #1E2422; }
.show-more[open] summary { margin-bottom: 0.2rem; }
footer { margin-top: 3rem; font-size: 0.8rem; color: #8A948F; }
</style>
</head>
<body>
  <h1>Support Metrics Report</h1>
  <p class="subtitle">$month_label &middot; REANNZ Researcher Support</p>

  $sections

  <script>
    window.addEventListener("load", () => {
      document.querySelectorAll(".js-plotly-plot").forEach(gd => Plotly.Plots.resize(gd));
    });
  </script>
</body>
</html>
